# Publishes to pub.dev when a version tag (v1.2.3) is pushed.
# Requires "Automated publishing" enabled on pub.dev (see RELEASING.md).
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # pub.dev verifies this workflow via OIDC — no secrets
    steps:
      - uses: actions/checkout@v4
      # Configures the pub.dev OIDC credentials for the publish step.
      - uses: dart-lang/setup-dart@v1
      # A Flutter plugin must be published with the Flutter SDK.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter pub publish --force
