name: health_workout_sync
description: >-
  Sync workouts from Apple Health and Health Connect (Samsung Health, Garmin,
  Fitbit, Oura…) into your backend, in the background, without losing or
  duplicating any.
version: 0.1.1
repository: https://github.com/usaman9040/health_workout_sync
issue_tracker: https://github.com/usaman9040/health_workout_sync/issues
topics:
  - health
  - healthkit
  - health-connect
  - fitness
  - workout

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0
  shared_preferences: ^2.3.0
  workmanager: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  # iOS: native HealthKit (anchored queries + HKObserverQuery background
  # delivery + a headless engine for background wakes). Android: native
  # Health Connect (permissions, changes tokens, record reads); scheduling is
  # delegated to `workmanager`.
  plugin:
    platforms:
      android:
        package: com.levelupfitness.health_workout_sync
        pluginClass: HealthWorkoutSyncPlugin
      ios:
        pluginClass: HealthWorkoutSyncPlugin

